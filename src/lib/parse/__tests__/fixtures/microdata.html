<!DOCTYPE html>
<html lang="en">
<body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Grandma's Banana Bread</h1>
  <img itemprop="image" src="https://example.com/banana.jpg" alt="" />
  <span itemprop="author">Grandma</span>
  <meta itemprop="prepTime" content="PT15M" />
  <meta itemprop="cookTime" content="PT60M" />
  <span itemprop="recipeYield">10 slices</span>
  <ul>
    <li itemprop="recipeIngredient">3 ripe bananas</li>
    <li itemprop="recipeIngredient">2 cups flour</li>
    <li itemprop="recipeIngredient">3/4 cup sugar</li>
    <li itemprop="recipeIngredient">1/2 cup butter, melted</li>
  </ul>
  <ol>
    <li itemprop="recipeInstructions">Mash the bananas.</li>
    <li itemprop="recipeInstructions">Mix everything together.</li>
    <li itemprop="recipeInstructions">Bake for an hour at 175C.</li>
  </ol>
</div>
</body>
</html>
