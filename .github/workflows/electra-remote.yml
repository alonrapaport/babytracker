name: Electra remote

on:
  push:
    paths:
      - 'electra-remote/**'
      - '.github/workflows/electra-remote.yml'
  pull_request:
    paths:
      - 'electra-remote/**'
      - '.github/workflows/electra-remote.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: electra-remote

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed, so this resolves within the declared ranges.
      - run: npm install --no-audit --no-fund

      - name: Protocol conformance
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the APK as a release asset.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm install --no-audit --no-fund

      - name: Build web assets and sync into the Android project
        run: npm run build && npx cap sync android

      - name: Assemble debug APK
        working-directory: electra-remote/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: electra-remote-debug-apk
          path: electra-remote/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artifacts download as a ZIP and need a login, which is painful on a
      # phone. A release asset is a plain .apk you can tap to install.
      - name: Publish the APK as a downloadable release
        if: github.ref_name == 'claude/new-app-creation-7c2bp4'
        working-directory: electra-remote/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create electra-remote-latest \
            --title "Electra AC Remote — latest debug build" \
            --notes "Unsigned debug build. Tap the .apk below on an Android phone to install; you will need to allow installs from your browser. Rebuilt on every push." \
            || echo "Release already exists, updating its asset."
          gh release upload electra-remote-latest \
            app/build/outputs/apk/debug/app-debug.apk#electra-remote.apk \
            --clobber
