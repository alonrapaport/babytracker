name: Electra remote

on:
  push:
    paths:
      - 'electra-remote/**'
      - '.github/workflows/electra-remote.yml'
  pull_request:
    paths:
      - 'electra-remote/**'
      - '.github/workflows/electra-remote.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: electra-remote

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed, so this resolves within the declared ranges.
      - run: npm install --no-audit --no-fund

      - name: Protocol conformance
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm install --no-audit --no-fund

      - name: Build web assets and sync into the Android project
        run: npm run build && npx cap sync android

      - name: Assemble debug APK
        working-directory: electra-remote/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: electra-remote-debug-apk
          path: electra-remote/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
