name: Deploy to GitHub Pages

# One deployment, two modes:
# - No Supabase secrets configured  -> builds the offline DEMO (VITE_DEMO=1).
# - VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY repo secrets set -> builds the
#   FULL app (accounts + cloud sync). The anon key is public-by-design
#   (Row-Level Security protects the data), so shipping it in the bundle is
#   the standard Supabase pattern. Either way, `<site-url>?demo` still opens
#   the instant offline demo.

on:
  push:
    branches:
      - main
      - claude/new-app-recime-features-nb5tbq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (demo without Supabase secrets, full app with them)
        run: npm run build
        env:
          VITE_DEMO: ${{ secrets.VITE_SUPABASE_URL == '' && '1' || '0' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deploy only from the dedicated recipebox repo — while this code lives on
    # a branch of the babytracker repo, deploying would overwrite that repo's
    # own GitHub Pages demo.
    if: github.repository == 'alonrapaport/recipebox'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
